asyncapi: 2.6.0
info:
  title: Chat Backend Socket.IO API
  version: 1.0.0
  description: |
    Real-time messaging API using Socket.IO for chat application.
    
    ## Authentication
    Connect with JWT token in auth object:
    ```javascript
    io('http://localhost:5000', { auth: { token: 'your_jwt_token' } })
    ```

servers:
  development:
    url: localhost:5000
    protocol: ws
    description: Development WebSocket server
  production:
    url: '{WS_HOST}'
    protocol: wss
    description: Production WebSocket server (secure)

channels:
  /:
    description: Main Socket.IO connection
    publish:
      summary: Events client can emit
      message:
        oneOf:
          - $ref: '#/components/messages/joinConversation'
          - $ref: '#/components/messages/leaveConversation'
          - $ref: '#/components/messages/sendMessage'
          - $ref: '#/components/messages/typingStart'
          - $ref: '#/components/messages/typingStop'
          - $ref: '#/components/messages/markConversationAsRead'
          - $ref: '#/components/messages/joinedMultipleConversations'
    subscribe:
      summary: Events client receives
      message:
        oneOf:
          - $ref: '#/components/messages/joined'
          - $ref: '#/components/messages/privateMessage'
          - $ref: '#/components/messages/messageDelivered'
          - $ref: '#/components/messages/messagesRead'
          - $ref: '#/components/messages/userTyping'
          - $ref: '#/components/messages/userStatusChanged'
          - $ref: '#/components/messages/joinedMultiple'
          - $ref: '#/components/messages/error'
          - $ref: '#/components/messages/messageEdited'
          - $ref: '#/components/messages/messageDeleted'

components:
  messages:
    # Client Emits (Publish)
    joinConversation:
      name: joinConversation
      title: Join Conversation
      summary: Join a conversation room to send/receive messages
      payload:
        type: object
        required:
          - conversationId
        properties:
          conversationId:
            type: string
            description: ID of the conversation to join
            example: "507f1f77bcf86cd799439011"
      x-response: joined
      
    leaveConversation:
      name: leaveConversation
      title: Leave Conversation
      summary: Leave the current conversation room
      description: Emit without a payload to leave the currently joined conversation.
      payload:
        type: object
        properties: {}
        additionalProperties: false
        example: {}
      
    sendMessage:
      name: sendMessage
      title: Send Message
      summary: Send a message in the joined conversation
      description: Must join conversation first using joinConversation
      payload:
        type: object
        required:
          - content
        properties:
          content:
            type: string
            description: Message text content
            example: "Hello, how are you?"
      x-response: privateMessage
      
    typingStart:
      name: typing-start
      title: Start Typing
      summary: Notify others you started typing
      description: Broadcasts to other participants in the conversation
      payload:
        type: object
        properties: {}
        additionalProperties: false
        example: {}
      x-response: userTyping
      
    typingStop:
      name: typing-stop
      title: Stop Typing
      summary: Notify others you stopped typing
      payload:
        type: object
        properties: {}
        additionalProperties: false
        example: {}
      x-response: userTyping
      
    markConversationAsRead:
      name: markConversationAsRead
      title: Mark Conversation As Read
      summary: Mark all messages in conversation as read
      payload:
        type: object
        required:
          - conversationId
        properties:
          conversationId:
            type: string
            example: "507f1f77bcf86cd799439011"
      x-response: messagesRead
      
    joinedMultipleConversations:
      name: joinedMultipleConversations
      title: Join Multiple Conversations
      summary: Join multiple conversation rooms at once
      description: Useful for receiving notifications from all conversations
      payload:
        type: object
        required:
          - conversationIds
        properties:
          conversationIds:
            type: array
            items:
              type: string
            example: ["conv_1", "conv_2", "conv_3"]
      x-response: joinedMultiple

    # Server Emits (Subscribe)
    joined:
      name: joined
      title: Joined Confirmation
      summary: Confirmation that you joined a conversation
      payload:
        type: object
        properties:
          conversationId:
            type: string
            example: "507f1f77bcf86cd799439011"
            
    privateMessage:
      name: privateMessage
      title: New Message
      summary: New message received in conversation
      payload:
        type: object
        properties:
          _id:
            type: string
            description: Message ID
            example: "507f1f77bcf86cd799439012"
          conversation:
            type: string
            description: Conversation ID
            example: "507f1f77bcf86cd799439011"
          sender:
            type: string
            description: Sender user ID
            example: "507f1f77bcf86cd799439013"
          receiver:
            type: string
            description: Receiver user ID
            example: "507f1f77bcf86cd799439014"
          content:
            type: string
            description: Message content
            example: "Hello!"
          delivered:
            type: boolean
            example: false
          deliveredAt:
            type: string
            format: date-time
            nullable: true
            example: "2026-10-30T14:50:00.000Z"
          read:
            type: boolean
            example: false
          readAt:
            type: string
            format: date-time
            nullable: true
            example: null
          edited:
            type: boolean
            example: false
          editedAt:
            type: string
            format: date-time
            nullable: true
            example: null
          deleted:
            type: boolean
            example: false
          deletedAt:
            type: string
            format: date-time
            nullable: true
            example: null
          createdAt:
            type: string
            format: date-time
            example: "2026-10-30T14:49:30.000Z"
          updatedAt:
            type: string
            format: date-time
            example: "2026-10-30T14:49:30.000Z"
            
    messageDelivered:
      name: messageDelivered
      title: Message Delivered
      summary: Message was delivered to recipient
      payload:
        type: object
        properties:
          messageId:
            type: string
            description: ID of delivered message
            example: "507f1f77bcf86cd799439012"
          deliveredAt:
            type: string
            format: date-time
            description: Delivery timestamp
            example: "2026-10-30T14:50:00.000Z"
            
    messagesRead:
      name: messagesRead
      title: Messages Read
      summary: Messages were read by recipient
      payload:
        type: object
        properties:
          conversationId:
            type: string
            description: Conversation ID
            example: "507f1f77bcf86cd799439011"
          readBy:
            type: string
            description: User ID who read messages
            example: "507f1f77bcf86cd799439013"
          readAt:
            type: string
            format: date-time
            description: Read timestamp
            example: "2026-10-30T14:50:05.000Z"
          count:
            type: number
            description: Number of messages marked as read
            example: 5

    messageEdited:
      name: messageEdited
      title: Message Edited
      summary: A message was edited by its sender
      description: Sent as the Socket.IO `message-edited` event to both participants when the sender calls PATCH /api/messages/{messageId}. Delivered to each user's personal room, so it arrives even if the conversation was not joined.
      x-triggered-by: PATCH /api/messages/{messageId}
      payload:
        type: object
        properties:
          messageId:
            type: string
            example: "507f1f77bcf86cd799439012"
          conversationId:
            type: string
            example: "507f1f77bcf86cd799439011"
          content:
            type: string
            description: The new message text
            example: "Updated message text"
          editedAt:
            type: string
            format: date-time
            example: "2026-10-30T14:51:00.000Z"

    messageDeleted:
      name: messageDeleted
      title: Message Deleted
      summary: A message was deleted by its sender (for everyone)
      description: Sent as the Socket.IO `message-deleted` event to both participants when the sender calls DELETE /api/messages/{messageId}. The content is wiped on the server and history returns the message with deleted true, so clients should show a "This message was deleted" placeholder. Sent once even if the delete is repeated.
      x-triggered-by: DELETE /api/messages/{messageId}
      payload:
        type: object
        properties:
          messageId:
            type: string
            example: "507f1f77bcf86cd799439012"
          conversationId:
            type: string
            example: "507f1f77bcf86cd799439011"
          deletedAt:
            type: string
            format: date-time
            example: "2026-10-30T14:52:00.000Z"
            
    userTyping:
      name: userTyping
      title: User Typing Status
      summary: User typing indicator update
      payload:
        type: object
        properties:
          conversationId:
            type: string
            example: "507f1f77bcf86cd799439011"
          userId:
            type: string
            description: User who is typing
            example: "507f1f77bcf86cd799439013"
          isTyping:
            type: boolean
            description: true when started, false when stopped
            example: true
          timestamp:
            type: number
            description: Unix timestamp
            example: 1793371800000
            
    userStatusChanged:
      name: userStatusChanged
      title: User Status Changed
      summary: User went online/offline
      payload:
        type: object
        properties:
          userId:
            type: string
            example: "507f1f77bcf86cd799439013"
          status:
            type: string
            enum: [ONLINE, OFFLINE, AWAY]
            example: ONLINE
          timestamp:
            type: number
            example: 1793371800000
          lastSeen:
            type: number
            description: Only present when going offline
            example: 1793371795000
            
    joinedMultiple:
      name: joinedMultiple
      title: Multiple Join Results
      summary: Results of joining multiple conversations
      payload:
        type: object
        properties:
          results:
            type: array
            items:
              type: object
              properties:
                conversationId:
                  type: string
                  example: "507f1f77bcf86cd799439011"
                status:
                  type: string
                  enum: [joined, denied]
                  example: joined
                  
    error:
      name: error
      title: Error
      summary: Error occurred during operation
      payload:
        type: object
        properties:
          message:
            type: string
            description: Error description
            example: "You must join a conversation first"

  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint
